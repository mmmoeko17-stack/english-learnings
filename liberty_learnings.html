          { text: "<b>remember</b>:", tags: ["vocab"] },

          { text: "　<span class=\'highlight\'>remember V-ing</span> = 〜したことを覚えている（過去の経験）", tags: ["vocab"] },

          { text: "<b>forget</b>:", tags: ["vocab"] },

          { text: "　<span class=\'highlight\'>forget V-ing</span> = 〜したことを忘れる（過去の経験を忘れる）", tags: ["vocab"] },

          { text: "　<span class=\'highlight\'>forget to V</span> = 〜することを忘れる（やり忘れる）", tags: ["vocab"] },

          { text: "<b>stop</b>:", tags: ["vocab"] },

          { text: "<b>try</b>:", tags: ["vocab"] },

          { text: "　<span class=\'highlight\'>try V-ing</span> = 試しに〜してみる", tags: ["vocab"] },

          { text: "　<span class=\'highlight\'>try to V</span> = 〜しようと努力する", tags: ["vocab"] },

          { text: "💡 <b>共通法則（時間軸で全部解ける）</b>: 動名詞 = 過去ベクトル（経験・すでにやったこと）/ 不定詞 = 未来ベクトル（これからのこと）", tags: ["tense","vocab"] },

          { text: "💡 <b>TOEIC頻出ペア</b>: despite ↔ although / because of ↔ because / during ↔ while", tags: ["vocab"] },

          { text: "　名詞が動作を <b>する</b> → <b>現在分詞（-ing）</b>", tags: ["verbal"] },

          { text: "　名詞が動作を <b>される</b> → <b>過去分詞（-ed）</b>", tags: ["verbal"] },

          { text: "💡 <b>全訳不要の攻略法</b>: 空欄直後の名詞だけ見て「この名詞は動作をする？される？」と一問だけ自問する", tags: ["verbal"] },

          { text: "　　例: <span class=\'highlight\'>surprised employees</span>（驚かされた従業員）✅ / <span class=\'highlight\'>surprising results</span>（驚かせる結果）✅", tags: ["verbal"] },

          { text: "　無生物（感情なし）→ -ed は意味が通じない", tags: ["verbal"] },

        ]

      },

        color: "#3ecf8e",

        points: [

          { text: "例文: your purchase will arrive <span class=\'highlight\'>in working condition</span>", tags: ["syntax"] },

          { text: "<b>working 単体</b> → <b>Adjective</b>（conditionというNounを修飾）", tags: ["verbal"] },

          { text: "<b>in working condition 全体</b> → <b>Adverb</b>（arrive を修飾する前置詞句）", tags: ["syntax"] },

          { text: "→ 「working = Adverb」という解釈は誤り。<b>working = Adjective / 前置詞句全体 = Adverb</b>", tags: ["syntax"] },

        ]

      }

          { text: "<b>節のみを結べる → so / for / but</b>（後ろには必ず S + V が来る）", tags: ["syntax"] },
          { text: "　例: It was raining, <span class=\'highlight\'>so</span> we stayed inside.", tags: ["syntax"] },
          { text: "　例: She left early, <span class=\'highlight\'>for</span> she had a meeting.", tags: ["syntax"] },
          { text: "　例: I wanted to go, <span class=\'highlight\'>but</span> I was busy.", tags: ["syntax"] },
          { text: "💡 <b>FANBOYS</b>（For / And / Nor / But / Or / Yet / So）が等位接続詞の全リスト", tags: ["syntax"] },
        ]
      },
      {
        title: "副詞節 → 副詞句の書き換え：分詞構文",
        color: "#a78bfa",
        tags: ["syntax","verbal"],
        points: [
          { text: "<b>副詞節（接続詞 + S + V）を副詞句に変えるとき → 基本は分詞構文。不定詞への書き換えはほぼしない</b>", tags: ["verbal"] },
          { text: "　<b>条件</b>: 主節と副詞節の主語が同じこと", tags: ["verbal"] },
          { text: "　<b>手順①</b>: 接続詞と主語を取り除く", tags: ["verbal"] },
          { text: "　<b>手順②</b>: 動詞を現在分詞（V-ing）に変える", tags: ["verbal"] },
          { text: "　例: <span class=\'highlight\'>Because she was tired,</span> she went to bed early.", tags: ["verbal"] },
          { text: "　　→ <span class=\'highlight\'>Being tired,</span> she went to bed early.", tags: ["verbal"] },
          { text: "　例: <span class=\'highlight\'>After he finished</span> his homework, he watched TV.", tags: ["verbal"] },
          { text: "　　→ <span class=\'highlight\'>After finishing</span> his homework, he watched TV.（接続詞はそのまま残せる）", tags: ["verbal"] },
          { text: "💡 <b>不定詞で書き換える副詞節は in order to / so as to などの目的表現のみ</b>（頻度はかなり低い）", tags: ["verbal"] },
        ]
      },
      {
        title: "If vs Whether：Noun節とAdverb節で意味が変わる",
        color: "#f5954a",
        tags: ["syntax","vocab"],
        points: [
          { text: "<b>Noun節として使う場合（動詞の目的語・主語）</b>", tags: ["syntax"] },
          { text: "　if ≒ whether：どちらも「〜かどうか」の意味で使える", tags: ["syntax"] },
          { text: "　例: I don\'t know <span class=\'highlight\'>if</span> he will come. ≒ I don\'t know <span class=\'highlight\'>whether</span> he will come.", tags: ["syntax"] },
          { text: "<b>Adverb節として使う場合（文全体を修飾）</b>", tags: ["syntax"] },
          { text: "　if：「もし〜なら」（条件）", tags: ["syntax"] },
          { text: "　whether：「〜に関係なく（whether...or...）」（譲歩・両方の可能性）", tags: ["syntax"] },
          { text: "　例: <span class=\'highlight\'>If</span> it rains, we\'ll stay inside.（条件）", tags: ["syntax"] },
          { text: "　例: <span class=\'highlight\'>Whether</span> it rains or not, we\'ll go.（〜に関係なく）", tags: ["syntax"] },
          { text: "⚠️ <b>Adverb節では if と whether は意味が異なるため置き換え不可</b>", tags: ["syntax"] },
        ]
      },
      {
        title: "despite 類義語一覧",
        color: "#f06a6a",
        tags: ["syntax","vocab"],
        points: [
          { text: "<b>despite の仲間（前置詞）— すべて後ろに Noun（句）が来る</b>", tags: ["syntax"] },
          { text: "　<span class=\'highlight\'>despite</span> + Noun / <span class=\'highlight\'>in spite of</span> + Noun", tags: ["vocab"] },
          { text: "　<span class=\'highlight\'>regardless of</span> + Noun（〜に関係なく）", tags: ["vocab"] },
          { text: "　<span class=\'highlight\'>notwithstanding</span> + Noun（〜にもかかわらず・フォーマル/法律文書）", tags: ["vocab"] },
          { text: "　<span class=\'highlight\'>with all</span> + Noun / <span class=\'highlight\'>for all</span> + Noun（〜があるにもかかわらず）", tags: ["vocab"] },
          { text: "　例: <span class=\'highlight\'>Despite the rain,</span> we went outside.", tags: ["vocab"] },
          { text: "　例: <span class=\'highlight\'>Regardless of the cost,</span> quality comes first.", tags: ["vocab"] },
          { text: "　例: <span class=\'highlight\'>With all his experience,</span> he made a mistake.", tags: ["vocab"] },
          { text: "💡 <b>接続詞との対比</b>: despite → although / in spite of → even though（後ろが S+V になるとき）", tags: ["syntax"] },
          { text: "⚠️ <b>notwithstanding</b> は文頭・文末どちらにも置ける点でやや特殊（法文書頻出）", tags: ["vocab"] },
        ]
      },
      {
        title: "重要語彙・表現",
        color: "#2dd4bf",
        tags: ["vocab"],
        points: [
          { text: "<b>no more than</b> = <b>only</b>（たったの・わずか）", tags: ["vocab"] },
          { text: "　例: There were <span class=\'highlight\'>no more than</span> five people in the room.（たった5人しかいなかった）", tags: ["vocab"] },
          { text: "<b>in advance</b> = <b>beforehand</b>（事前に・前もって）", tags: ["vocab"] },
          { text: "　例: Please submit your report <span class=\'highlight\'>in advance</span>.（事前に提出してください）", tags: ["vocab"] },
          { text: "<b>specialize in ~</b>（〜に特化する・〜を専門とする）", tags: ["vocab"] },
          { text: "　例: This clinic <span class=\'highlight\'>specializes in</span> sports injuries.（スポーツ外傷を専門とする）", tags: ["vocab"] },
          { text: "<b>as</b> = <b>because / since</b>（理由を表す接続詞として使える）", tags: ["vocab"] },
          { text: "　例: <span class=\'highlight\'>As</span> it was late, we decided to leave.（遅かったので出発することにした）", tags: ["vocab"] },
          { text: "　⚠️ as は「〜として / 〜しながら / 〜のように」など多義語。文脈で判断", tags: ["vocab"] },
          { text: "<b>a rich source of ~</b>（〜の豊富な供給源）", tags: ["vocab"] },
          { text: "　例: Fish is <span class=\'highlight\'>a rich source of</span> protein and omega-3.（魚はたんぱく質とオメガ3の豊富な供給源）", tags: ["vocab"] },
        ]
      },
      {
        title: "関係副詞 vs 関係代名詞 — 後ろの文の完全性",
        color: "#4f8ef7",
        tags: ["syntax","verbal"],
        points: [
          { text: "<b>関係副詞（where / when / why / how）</b>: 副詞の役割のみ → <b>後ろの文は完全体（S + V + O）になる</b>", tags: ["syntax","verbal"] },
          { text: "　例: This is the city <span class=\'highlight\'>where</span> she <b>was born</b>.（was born = 完全な文）", tags: ["syntax"] },
          { text: "　例: I remember the day <span class=\'highlight\'>when</span> we <b>first met</b>.（first met = 完全な文）", tags: ["syntax"] },
          { text: "　💡 where / when / why / how は節内で「場所・時・理由・方法」の意味を添えるだけ → 名詞の穴がない", tags: ["syntax"] },
          { text: "<b>関係代名詞（who / which / that など）</b>: 代名詞の役割も果たす → <b>後ろの文は不完全（S または O が欠ける）</b>", tags: ["syntax","verbal"] },
          { text: "　例: This is the man <span class=\'highlight\'>who</span> <b>helped me</b>.（主語が欠けている）", tags: ["syntax"] },
          { text: "　例: The book <span class=\'highlight\'>that</span> I <b>read</b> was interesting.（目的語が欠けている）", tags: ["syntax"] },
          { text: "　💡 関係代名詞自体が節の中でS/O/Cの役割を担うため、節の中に名詞の空白がある", tags: ["syntax"] },
          { text: "⚠️ <b>見極め法</b>: 後ろの文が完全体 → 関係副詞 / 後ろの文が不完全（名詞が欠ける）→ 関係代名詞", tags: ["syntax"] },
        ]
      }
    ]
  }

];



let currentFilter = 'all';



function buildHTML(lessons) {

  const container = document.getElementById('lessons-container');

  container.innerHTML = '';

  let shown = 0;

  lessons.forEach(lesson => {

    // Filter

    if (currentFilter !== 'all') {

      const hasTag = lesson.topics.some(t => t.tags.includes(currentFilter));

      if (!hasTag) return;

    }

    shown++;

    const card = document.createElement('div');

    card.className = 'lesson-card' + (lesson.num === lessons[lessons.length-1].num ? ' open' : '');

    card.dataset.num = lesson.num;



    const topicsHTML = lesson.topics.map(topic => {

      if (currentFilter !== 'all' && !topic.tags.includes(currentFilter)) return '';

      const pointsHTML = topic.points.map(p => {

        if (currentFilter !== 'all' && !p.tags.some(t => t === currentFilter)) return '';

        return `<div class="point"><span class="point-bullet">›</span><span>${p.text}</span></div>`;

      }).join('');

      if (!pointsHTML.trim()) return '';

      return `

        <div class="topic-section">

          <div class="topic-title">

            <span class="topic-dot" style="background:${topic.color}"></span>

            ${topic.title}

          </div>

          ${pointsHTML}

        </div>`;

    }).join('');



    card.innerHTML = `

      <div class="lesson-header" onclick="toggleCard(this)">

        <div class="lesson-meta">

          <span class="lesson-num">第${lesson.num}回</span>

          <div>

            <div class="lesson-title">${lesson.title}</div>

            <div class="lesson-date">${lesson.date}</div>

          </div>

        </div>

        <span class="lesson-toggle">▼</span>

      </div>

      <div class="lesson-body">

        ${lesson.caution ? `<div class="note-caution">⚠️ ${lesson.caution}</div><br>` : ''}

        ${topicsHTML || '<div style="color:var(--muted);font-size:0.85rem;">このフィルターに該当するメモがありません</div>'}

      </div>`;

    container.appendChild(card);

  });

  document.getElementById('no-results').style.display = shown === 0 ? 'block' : 'none';

}



function toggleCard(header) {

  header.parentElement.classList.toggle('open');

}



function setFilter(f, el) {

  currentFilter = f;

  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));

  el.classList.add('active');

  buildHTML(LESSONS);

}



function doSearch() {

  const q = document.getElementById('search').value.toLowerCase();

  if (!q) { buildHTML(LESSONS); return; }

  const filtered = LESSONS.filter(lesson =>

    lesson.title.toLowerCase().includes(q) ||

    lesson.topics.some(t =>

      t.title.toLowerCase().includes(q) ||

      t.points.some(p => p.text.toLowerCase().includes(q))

    )

  );

  buildHTML(filtered);

}



buildHTML(LESSONS);

</script>
