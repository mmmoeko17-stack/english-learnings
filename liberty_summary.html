          { text: '<b>前置詞句の機能</b>: 場所によってAdjectiveかAdverbかが決まる' },
          { text: '→ Noun の後ろ = <b>Adjective</b> / Verb の後ろ・文頭・文末 = <b>Adverb</b>' },
        ]
      },
      {
        title: 'Correlation — not only A but also B / so~that / such~that',
        lessons: ['第3回'],
        points: [
          { text: '<b>not only A but also B</b>: 動詞はBに合わせる' },
          { text: '<b>so ~ that ... = such ~ that ...</b>（意味は同じ）' },
          { text: '<span class="warn">⚠️ such の後ろはNoun（形容詞+名詞）、so の後ろはAdjective/Adverb</span>' },
          { text: '例: <span class="highlight">so tired that</span> she fell asleep / <span class="highlight">such a long journey that</span> we needed a rest' },
        ]
      },
      {
        title: 'Conjunction Adverb — however の使い方',
        lessons: ['第3回'],
        points: [
          { text: '<b>接続詞的副詞</b>: therefore / meanwhile / however など' },
          { text: '<span class="warn">⚠️ 2文をコンマだけでつなぐのはComma Splice（文法エラー）</span>' },
          { text: '✅ He was tired; <span class="highlight">however,</span> he continued.（セミコロン使用）' },
          { text: '✅ He was tired. <span class="highlight">However,</span> he continued.（ピリオドで分ける）' },
          { text: '<b>however の位置</b>: 文頭 → <span class="highlight">However,</span> ／ 文中 → , <span class="highlight">however,</span> ／ 文末 → , <span class="highlight">however.</span>' },
          { text: '💡 <b>however = no matter how の別用法</b>: <span class="highlight">However hard</span> you try, you cannot win.' },
        ]
      },
    ]
  },
  ,
  {
    id: 'passive',
    icon: '🔄',
    title: 'Passive Voice（受け身）',
    color: '#f06a6a',
    sections: [
      {
        title: '受け身の構造 — 目的語が主語になる',
        lessons: ['第4回'],
        points: [
          { text: '受け身 = <b>能動態の目的語（O）が主語（S）になった文</b>' },
          { text: '能動: The company <span class="highlight">established</span> the standards.' },
          { text: '受動: The standards <span class="highlight">were established</span> by the company.' },
          { text: '構造: S + <span class="highlight">be + 過去分詞</span>（+ by + 行為者）' },
          { text: '💡 by以下は省略可能（誰がやったか不明・重要でない場合）' },
        ]
      },
      {
        title: '-ing vs -ed 分詞形容詞の瞬時判断',
        lessons: ['第3回','第4回'],
        points: [
          { text: '名詞が動作を <b>する</b> → <b>-ing（現在分詞）</b>' },
          { text: '名詞が動作を <b>される</b> → <b>-ed（過去分詞）</b>' },
          { text: '例: <span class="highlight">established</span> standards（基準が確立される）✅' },
          { text: '💡 <b>全訳不要の攻略法</b>: 名詞だけ見て「する？される？」と一問だけ自問' },
          { text: '<b>無生物には -ed が使えないケースあり</b>: surprised results ❌ → surprising results ✅' },
          { text: '<b>人・動物</b>: -ing / -ed どちらも文脈次第 → surprised employees ✅ / surprising employees ✅' },
        ]
      },
    ]
  }
];

let currentFilter = 'all';

function buildTabs() {
  const tabs = document.getElementById('tabs');
  const allTab = `<div class="tab active" style="border-color:var(--accent);color:var(--accent);" onclick="setFilter('all',this)">すべて</div>`;
  const catTabs = CATEGORIES.map(c =>
    `<div class="tab" style="" onclick="setFilter('${c.id}',this)" data-color="${c.color}">${c.icon} ${c.title.split('（')[0]}</div>`
  ).join('');
  tabs.innerHTML = allTab + catTabs;
}

function setFilter(id, el) {
  currentFilter = id;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.remove('active');
    t.style.borderColor = ''; t.style.color = '';
  });
  el.classList.add('active');
  const color = id === 'all' ? 'var(--accent)' : (el.dataset.color || 'var(--accent)');
  el.style.borderColor = color; el.style.color = color;
  render();
}

function render(query = '') {
  const container = document.getElementById('container');
  container.innerHTML = '';
  let shown = 0;

  CATEGORIES.forEach(cat => {
    if (currentFilter !== 'all' && currentFilter !== cat.id) return;

    const filteredSections = cat.sections.filter(sec => {
      if (!query) return true;
      const q = query.toLowerCase();
      return sec.title.toLowerCase().includes(q) ||
        sec.points.some(p => p.text.toLowerCase().includes(q)) ||
        (sec.tipbox && sec.tipbox.text.toLowerCase().includes(q));
    });
    if (filteredSections.length === 0) return;
    shown++;

    const sectionsHTML = filteredSections.map(sec => {
      const pointsHTML = sec.points.map(p =>
        `<div class="point"><span class="point-bullet">›</span><span>${p.text}</span></div>`
      ).join('');
      const tipHTML = sec.tipbox
        ? `<div class="tip-box ${sec.tipbox.type||''}">${sec.tipbox.text}</div>` : '';
      const lessonTags = sec.lessons.map(l =>
        `<span class="lesson-tag">${l}</span>`).join(' ');
      return `<div class="section">
        <div class="section-title">${sec.title} ${lessonTags}</div>
        ${pointsHTML}${tipHTML}
      </div>`;
    }).join('');

    const totalPoints = filteredSections.reduce((s, sec) => s + sec.points.length, 0);
    const card = document.createElement('div');
    card.className = 'cat-card open';
    card.innerHTML = `
      <div class="cat-header" onclick="this.parentElement.classList.toggle('open')"
           style="border-left:4px solid ${cat.color};">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-title">${cat.title}</span>
        <span class="cat-count">${totalPoints} ポイント</span>
        <span class="cat-toggle">▼</span>
      </div>
      <div class="cat-body">${sectionsHTML}</div>`;
    container.appendChild(card);
  });

  document.getElementById('no-results').style.display = shown === 0 ? 'block' : 'none';
}

function doSearch() {
  render(document.getElementById('search').value);
}

buildTabs();
render();
</script>
</body>
</html>
